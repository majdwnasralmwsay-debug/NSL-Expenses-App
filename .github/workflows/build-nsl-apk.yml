name: Build NSL Expenses APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q NSL_Android_GitHub_READY.zip -d android-project

      - name: Build APK
        working-directory: android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSL-Expenses-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
