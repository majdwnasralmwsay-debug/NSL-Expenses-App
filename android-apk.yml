name: NSL Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q NSL_Android_GitHub_READY.zip -d android-project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android project
        working-directory: android-project
        run: |
          echo "Android project files:"
          ls -la
          echo "App folder:"
          ls -la app
          echo "Gradle:"
          gradle --version

      - name: Build APK
        working-directory: android-project
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSL-Expenses-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
